<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#343c2e" />
    <title>RokaWright · The workroom</title>
    <style>:root {
  --cream: #f5f1e7;
  --ink: #272923;
  --olive: #414b36;
  --brass: #a68046;
  --line: #ddd8cc;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font:
    15px "DM Sans",
    Arial,
    sans-serif;
}
header {
  display: flex;
  align-items: center;
  gap: 40px;
  padding: 25px 5%;
  border-bottom: 1px solid var(--line);
  background: #faf8f1;
}
.brand {
  text-decoration: none;
  color: var(--ink);
  font-family: Georgia, serif;
  font-size: 30px;
  letter-spacing: -1.5px;
}
.brand span {
  color: var(--olive);
}
.brand small {
  display: block;
  font: 9px Arial;
  letter-spacing: 2px;
  margin-top: 7px;
}
nav {
  display: flex;
  gap: 5px;
  flex: 1;
}
button {
  cursor: pointer;
  border: 0;
  border-radius: 4px;
  padding: 12px 18px;
  background: var(--olive);
  color: white;
  font:
    600 13px "DM Sans",
    Arial;
  transition: background 0.15s;
}
button:hover {
  background: #596347;
}
nav button,
.quiet {
  background: transparent;
  color: var(--ink);
}
nav button.active {
  background: #e8e7dc;
  color: var(--olive);
}
.quiet:hover {
  background: #e9e3d6;
}
.danger {
  color: #9b3d32;
  background: #f5e9e3;
}
.small {
  padding: 8px 11px;
  font-size: 12px;
}
main {
  max-width: 1220px;
  margin: auto;
  padding: 42px 30px 70px;
}
.eyebrow {
  color: var(--brass);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
}
h1,
h2,
h3 {
  font-weight: 400;
  font-family: "Libre Caslon Display", Georgia, serif;
}
h1 {
  font-size: 56px;
  line-height: 1;
  margin: 13px 0;
}
h2 {
  font-size: 29px;
  margin: 0 0 18px;
}
h3 {
  font-size: 23px;
  margin: 0 0 8px;
}
.intro {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}
.intro p,
.muted {
  color: #77786d;
  font-size: 13px;
  line-height: 1.7;
}
.badge {
  font-size: 11px;
  letter-spacing: 1px;
  border: 1px solid #c6c9b8;
  padding: 9px 12px;
  color: var(--olive);
  border-radius: 30px;
}
.layout {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 24px;
}
.panel {
  background: #fcfaf5;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 25px;
  margin-bottom: 20px;
}
.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px dashed #c9c3b3;
  padding-bottom: 16px;
  margin-bottom: 20px;
}
.panel-title h2 {
  margin: 0;
}
.number {
  font: 11px Arial;
  color: var(--brass);
  letter-spacing: 1px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.service {
  background: #f5f2e9;
  color: var(--ink);
  text-align: left;
  border: 1px solid var(--line);
  min-height: 93px;
  padding: 14px;
}
.service:hover {
  background: #e9ecdf;
  border-color: #899376;
}
.service b {
  display: block;
  font-size: 13px;
  margin: 6px 0;
}
.service span {
  font-size: 12px;
  color: #687058;
}
.service i {
  font-style: normal;
  color: var(--brass);
  font-size: 19px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 14px;
}
input,
select,
textarea {
  width: 100%;
  margin-top: 7px;
  padding: 11px 12px;
  border: 1px solid #d8d3c7;
  background: #fffefa;
  color: var(--ink);
  border-radius: 3px;
  font: 14px Arial;
}
textarea {
  min-height: 76px;
  resize: vertical;
}
input:focus,
textarea:focus,
select:focus {
  outline: 2px solid #a3ad90;
  outline-offset: 1px;
}
.line {
  border: 1px solid var(--line);
  border-left: 3px solid var(--brass);
  padding: 17px;
  margin-top: 15px;
  background: white;
}
.line-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.line-head input {
  margin: 0;
  font-weight: bold;
}
.line-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  gap: 12px;
}
.hint {
  font-size: 11px;
  color: #77786d;
  line-height: 1.6;
}
.summary {
  position: sticky;
  top: 20px;
  align-self: start;
  background: var(--olive);
  color: #fff;
  padding: 27px;
  border-radius: 6px;
}
.summary h2 {
  color: #f7f1de;
}
.summary .eyebrow {
  color: #d3bd89;
}
.sum-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 16px 0;
  font-size: 13px;
}
.big-total {
  font-family: Georgia, serif;
  font-size: 42px;
  padding: 20px 0;
  border-top: 1px dashed #859073;
  border-bottom: 1px dashed #859073;
  margin: 20px 0;
}
.summary button {
  width: 100%;
  margin-top: 10px;
  background: #e7cf9f;
  color: #30352a;
}
.summary .quiet {
  background: transparent;
  color: white;
  border: 1px solid #818c70;
}
.summary .hint {
  color: #c9cfbe;
}
.empty {
  padding: 30px;
  text-align: center;
  border: 1px dashed #d2cabb;
  color: #74766a;
  line-height: 1.8;
}
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.toolbar input,
.toolbar select {
  margin: 0;
}
.records {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}
.record {
  background: #fcfaf5;
  border: 1px solid var(--line);
  padding: 23px;
  border-radius: 5px;
}
.record .actions,
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 17px;
}
.overdue {
  color: #a14334;
  font-size: 12px;
  font-weight: bold;
}
.status {
  display: inline-block;
  background: #e7eadf;
  color: #414b36;
  padding: 5px 9px;
  border-radius: 3px;
  font-size: 11px;
}
.price-row {
  display: grid;
  grid-template-columns: 1fr 140px auto;
  align-items: center;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.price-row input {
  margin: 0;
}
footer {
  border-top: 1px solid var(--line);
  padding: 23px 5%;
  font-size: 10px;
  letter-spacing: 1px;
  color: #6e735f;
  display: flex;
  justify-content: space-between;
  gap: 20px;
}
footer span {
  letter-spacing: 0;
  font-size: 12px;
}
#notice {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #272923;
  color: white;
  border-radius: 5px;
  padding: 13px 22px;
  max-width: 90%;
  z-index: 10;
}
#notice:empty {
  display: none;
}
dialog {
  border: 1px solid var(--line);
  border-radius: 8px;
  max-width: 520px;
  padding: 30px;
  background: var(--cream);
}
dialog::backdrop {
  background: #20271fcc;
}
hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 22px 0;
}
.measure-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.print-only {
  display: none;
}
.payment {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 10px 0;
}
table {
  width: 100%;
  border-collapse: collapse;
}
td,
th {
  padding: 12px 6px;
  border-bottom: 1px solid #ccc;
  text-align: left;
}
th {
  font-size: 12px;
}
.quote-total {
  text-align: right;
  font-size: 20px;
}
.quote-note {
  margin-top: 30px;
  border-top: 1px solid #aaa;
  padding-top: 15px;
}
@media (max-width: 800px) {
  header {
    flex-wrap: wrap;
    gap: 15px;
    padding: 20px;
  }
  .brand {
    flex: 1;
  }
  nav {
    order: 3;
    width: 100%;
    flex: none;
    justify-content: space-between;
  }
  nav button {
    padding: 10px;
  }
  main {
    padding: 28px 16px;
  }
  h1 {
    font-size: 44px;
  }
  .layout {
    grid-template-columns: 1fr;
  }
  .summary {
    position: static;
  }
  .cards {
    grid-template-columns: repeat(2, 1fr);
  }
  .records {
    grid-template-columns: 1fr;
  }
  .intro .badge {
    display: none;
  }
  .panel {
    padding: 18px;
  }
  .measure-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .price-row {
    grid-template-columns: 1fr 95px auto;
    gap: 7px;
  }
  .line-grid {
    grid-template-columns: 1fr 1fr;
  }
  .line-grid label:last-child {
    grid-column: 1/-1;
  }
  footer {
    flex-direction: column;
  }
  .toolbar {
    flex-wrap: wrap;
  }
  .fields {
    gap: 10px;
  }
  button {
    min-height: 40px;
  }
}
@media print {
  @page {
    margin: 18mm;
  }
  body {
    background: white;
    color: black;
    font: 12px Arial;
  }
  header,
  footer,
  #app,
  #notice,
  dialog {
    display: none !important;
  }
  .print-only {
    display: block !important;
  }
  h1 {
    font-size: 36px;
  }
  h2 {
    font-size: 25px;
  }
  tr {
    break-inside: avoid;
  }
  .quote-note {
    font-size: 11px;
  }
  .quote-total {
    break-inside: avoid;
  }
}
.storage-warning {
  background: #f4dfd2;
  padding: 18px 5%;
  color: #76372a;
  line-height: 1.6;
}
@media print {
  .storage-warning {
    display: none;
  }
}
.job-feedback {
  background: #f0e9d8;
  color: #303a29;
  padding: 14px;
  border-radius: 4px;
  line-height: 1.6;
  font-size: 13px;
}
.job-feedback.error {
  background: #f7dfd4;
  color: #76372a;
}
#quote-preview {
  width: min(940px, 95vw);
  max-width: 940px;
  max-height: 90vh;
  overflow: auto;
}
.quote-sheet {
  margin-top: 24px;
  padding: 25px;
  background: white;
  border: 1px solid #ddd8cc;
  overflow-x: auto;
}
.quote-sheet h1 {
  font-size: 36px;
}
@media print {
  .confirmation,
  #quote-preview {
    display: none !important;
  }
}
/* Hand-drawn initials echo the owner's supplied RW artwork. */
.brand { display:block; color:#503443; flex-shrink:0; text-decoration:none; }
.brand .wordmark { display:flex; align-items:baseline; height:49px; color:#503443; gap:0; }
.brand .word-fragment { color:inherit; font:italic 35px Georgia,serif; letter-spacing:-1.6px; }
.letter-r { width:38px; height:50px; overflow:visible; align-self:center; margin-right:-6px; }
.letter-w { width:34px; height:39px; align-self:center; margin:0 -2px 0 1px; overflow:visible; }
.brand small { color:#777064; letter-spacing:1.8px; font-size:9px; margin-top:6px; }
.header-logo { margin-left:auto; padding:4px; flex-shrink:0; }
.header-logo .rw-monogram { display:block; width:78px; height:78px; }
.footer-brand { display:flex; align-items:center; gap:12px; flex-shrink:0; }
.footer-brand .rw-monogram { width:32px; height:32px; }
footer { align-items:center; }
footer #backup-open { font-size:11px; white-space:nowrap; flex-shrink:0; }

      <nav aria-label="Main navigation">

        ><button data-view="jobs">Saved Jobs</button
        ><button data-view="prices">Prices</button>
      </nav>
      <div class="header-logo"><svg class="rw-monogram" viewBox="0 0 300 300" role="img" aria-label="RokaWright RW logo" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#503443" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="17" d="M42 132 C23 103 53 54 93 28 C123 9 161 12 175 40 C196 80 161 117 111 142 M104 67 C91 108 71 154 56 197 L35 241"/><path stroke-width="12" d="M165 30 C198 75 187 119 143 139 C125 147 113 148 109 145 M115 146 C154 142 169 167 166 205 L166 254 L194 192 L228 269 L253 167"/></g><path fill="#503443" d="M26 236 Q35 229 41 239 L37 248 Q29 256 24 247 Z M190 183 Q196 178 201 187 L199 197 L189 194 Z M259 263 Q266 250 279 253 Q290 259 279 272 Q267 282 259 272 Z"/></svg></div>
    </header>
    <main id="app"></main>
    <footer>
      <div class="footer-brand"><svg class="rw-monogram" viewBox="0 0 300 300" role="img" aria-label="RokaWright RW logo" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#503443" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="17" d="M42 132 C23 103 53 54 93 28 C123 9 161 12 175 40 C196 80 161 117 111 142 M104 67 C91 108 71 154 56 197 L35 241"/><path stroke-width="12" d="M165 30 C198 75 187 119 143 139 C125 147 113 148 109 145 M115 146 C154 142 169 167 166 205 L166 254 L194 192 L228 269 L253 167"/></g><path fill="#503443" d="M26 236 Q35 229 41 239 L37 248 Q29 256 24 247 Z M190 183 Q196 178 201 187 L199 197 L189 194 Z M259 263 Q266 250 279 253 Q290 259 279 272 Q267 282 259 272 Z"/></svg><span>YOUR LOCAL WORKROOM</span></div>
      <span
        >Records stay in this browser on this device. Sharing the link does not
        share your records.</span
      >
      <button id="backup-open" class="quiet">Backup & restore</button>
    </footer>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="backup">
      <h2>Keep your work safe.</h2>
      <p>
        Download a backup regularly and before clearing browser data. Store it
        somewhere private: it contains customer information.
      </p>
      <button id="export">Download JSON backup</button>
      <hr />
      <label
        >Restore a RokaWright backup<input
          id="import"
          type="file"
          accept="application/json,.json"
      /></label>
      <p id="backup-message" role="status"></p>
      <button id="restore" hidden>Replace saved data with this backup</button
      ><button id="backup-close" class="quiet">Close</button>

    <script type="module">const defaults = [
  ["Alter pants", 500],
  ["Add both pockets to pants", 500],
  ["Alter a shirt", 400],
  ["Make shorts", 300],
  ["Make a do-rag", 1000],
  ["Make sweatpants", 3000],
  ["Make a hoodie", 1200],
  ["Make a pillowcase", 300],
  ["Make a sleep mask", 400],
  ["Replace zipper", null],
  ["Repair tear", null],
  ["Add sleeves to shirt", null],
].map(([name, cents], i) => ({ id: "service-" + i, name, cents }));
const statuses = ["Waiting", "In progress", "Ready", "Collected"];
function amount(value) {
  if (!/^\d+(\.\d{1,2})?$/.test(String(value).trim()))
    throw Error("Enter a non-negative amount with up to two decimal places.");
  const [a, b = ""] = String(value).trim().split(".");
  const n = Number(a) * 100 + Number(b.padEnd(2, "0"));
  if (!Number.isSafeInteger(n) || n > 100000000)
    throw Error("Amount is too large.");
  return n;
}
function quantity(value) {
  if (
    !/^\d+$/.test(String(value)) ||
    Number(value) < 1 ||
    Number(value) > 100000
  )
    throw Error("Quantity must be a positive whole number (up to 100,000).");
  return Number(value);
}
function lineTotal(l) {
  return l.cents * l.quantity + l.extraCents;
}
function total(job) {
  const n = job.lines.reduce((n, l) => n + lineTotal(l), 0);
  if (!Number.isSafeInteger(n) || n > 1000000000000)
    throw Error("Job total is too large. Reduce the price or quantity.");
  return n;
}
function paid(job) {
  return job.payments.reduce((n, p) => n + p.cents, 0);
}
const money = (c) =>
  new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(
    c / 100,
  );
const fresh = () => ({
  version: 1,
  customers: [],
  jobs: [],
  services: structuredClone(defaults),
});
function validate(data) {
  const fail = () => {
    throw Error(
      "This file is not a valid RokaWright version 1 backup. No data was replaced.",
    );
  };
  const str = (v) => typeof v === "string" && v.length <= 20000;
  const cash = (v) => Number.isSafeInteger(v) && v >= 0 && v <= 100000000;
  const date = (v) =>
    str(v) &&
    /^\d{4}-\d{2}-\d{2}$/.test(v) &&
    !Number.isNaN(Date.parse(v)) &&
    new Date(v).toISOString().slice(0, 10) === v;
  const list = (a, fn) => {
    if (!Array.isArray(a) || a.length > 10000) fail();
    const ids = new Set();
    for (const x of a) {
      if (
        !x ||
        !str(x.id) ||
        !/^[a-zA-Z0-9_-]{1,100}$/.test(x.id) ||
        ids.has(x.id) ||
        !fn(x)
      )
        fail();
      ids.add(x.id);
    }
  };
  const measurements = (m) =>
    m &&
    ["in", "cm"].includes(m.unit) &&
    m.values &&
    typeof m.values === "object" &&
    !Array.isArray(m.values) &&
    Object.keys(m.values).length <= 50 &&
    Object.entries(m.values).every(
      ([k, v]) =>
        str(k) &&
        str(v) &&
        (v === "" ||
          (/^\d+(\.\d{1,2})?$/.test(v) && Number(v) > 0 && Number(v) <= 1000)),
    );
  if (!data || data.version !== 1) fail();
  list(
    data.services,
    (s) => str(s.name) && s.name.trim() && (s.cents === null || cash(s.cents)),
  );
  list(
    data.customers,
    (c) =>
      str(c.name) &&
      c.name.trim() &&
      str(c.phone) &&
      str(c.email) &&
      str(c.notes) &&
      measurements(c.measurements),
  );
  list(data.jobs, (j) => {
    if (!(
      str(j.reference) &&
      date(j.created) &&
      str(j.due) &&
      (!j.due || date(j.due)) &&
      str(j.customerId) &&
      str(j.customerName) &&
      str(j.notes) &&
      str(j.instructions) &&
      statuses.includes(j.status) &&
      ["Quote", "Job"].includes(j.kind) &&
      measurements(j.measurements)
    ))
      return false;
    list(
      j.lines,
      (l) =>
        str(l.serviceId) &&
        str(l.name) &&
        l.name.trim() &&
        cash(l.cents) &&
        Number.isInteger(l.quantity) &&
        l.quantity > 0 &&
        l.quantity <= 100000 &&
        cash(l.extraCents) &&
        str(l.extraNote) &&
        str(l.details),
    );
    list(
      j.payments,
      (p) => cash(p.cents) && p.cents > 0 && date(p.date) && str(p.note),
    );
    if (
      !Number.isSafeInteger(j.lines.reduce((n, l) => n + lineTotal(l), 0)) ||

    "notes",
    "instructions",

  if (!draft.reference.trim()) throw Error("Enter a job reference.");

          }
        }),
    );
  };
  list();
  $("#job-search").oninput = list;
  $("#status-filter").onchange = list;
}
function renderPrices() {
  $("#app").innerHTML =
    intro(
      "The price of good work.",
      "Your standard rates. Saved jobs always keep their own prices.",
    ) +
    `<section class="panel"><h2>Service menu <span class="muted">· US dollars</span></h2><p class="hint">Blank price means “enter a custom price” when adding this service to a job. Removing a service leaves historical jobs intact.</p>${data.services.map((s) => `<form class="price-row" data-price="${s.id}"><input name="name" aria-label="Service name" value="${esc(s.name)}" required><input name="price" aria-label="Price for ${esc(s.name)}" type="number" min="0" step="0.01" placeholder="Custom" value="${s.cents === null ? "" : (s.cents / 100).toFixed(2)}"><div><button class="small">Save</button><button type="button" class="quiet small" data-service-delete="${s.id}" aria-label="Remove ${esc(s.name)}">✕</button></div></form>`).join("")}<h3 style="margin-top:25px">Add a service</h3><form id="new-service" class="price-row"><input name="name" aria-label="New service name" placeholder="Service description" required><input name="price" aria-label="New service price" type="number" min="0" step="0.01" placeholder="Custom"><button>Add service</button></form></section>`;
  document.querySelectorAll("[data-price],#new-service").forEach(
    (f) =>
      (f.onsubmit = (e) => {
        e.preventDefault();
        try {
          const name = f.elements.name.value.trim();
          if (!name) throw Error("Enter a service name.");
          const cents =
            f.elements.price.value === ""
              ? null
              : amount(f.elements.price.value);
          if (
            commit((d) => {
              if (f.dataset.price)
                Object.assign(
                  d.services.find((s) => s.id === f.dataset.price),
                  { name, cents },
                );
              else d.services.push({ id: id(), name, cents });
            })
          ) {
            toast("Price list saved. Existing quotes are unchanged.");
            renderPrices();
          }
        } catch (e) {
          toast(e.message);
        }
      }),
  );
  document.querySelectorAll("[data-service-delete]").forEach(
    (b) =>
      (b.onclick = async () => {
        if (
          (await askConfirm(
            "Remove this service from the active menu? Saved jobs will keep it.",
          )) &&
          commit(
            (d) =>
              (d.services = d.services.filter(
                (s) => s.id !== b.dataset.serviceDelete,
              )),
          )
        )
          renderPrices();
      }),
  );
}
function printQuote() {
  document.querySelector(".print-only")?.remove();
  const q = document.createElement("section");
  q.className = "print-only";
  q.innerHTML = `<div class="eyebrow">ALTERATIONS / MADE WITH CARE</div><div class="quote-brand" style="display:flex;align-items:center;justify-content:space-between"><h1>RokaWright</h1>${document.querySelector(".header-logo svg").outerHTML.replace('class="rw-monogram"', 'class="rw-monogram" style="width:65px;height:65px"')}</div><h2>${draft.kind} · ${esc(draft.reference)}</h2><p>Customer: ${esc(draft.customerName || "Quick quote")}<br>Created: ${draft.created}${draft.due ? "<br>Due: " + draft.due : ""}</p><table><thead><tr><th>Service</th><th>Qty</th><th>Unit price</th><th>Extra work (once)</th><th>Line total</th></tr></thead><tbody>${draft.lines.map((l) => `<tr><td>${esc(l.name)}${l.details ? "<br><small>" + esc(l.details) + "</small>" : ""}${l.extraNote ? "<br><small>Extra work: " + esc(l.extraNote) + "</small>" : ""}</td><td>${l.quantity}</td><td>${money(l.cents)}</td><td>${money(l.extraCents)}</td><td>${money(lineTotal(l))}</td></tr>`).join("")}</tbody></table><div class="quote-total"><p>Total: <b>${money(total(draft))}</b></p><p>Amount paid: ${money(paid(draft))}</p><p>${paid(draft) > total(draft) ? "Overpayment" : "Balance remaining"}: <b>${money(Math.abs(total(draft) - paid(draft)))}</b></p></div><p class="quote-note">Customers supply materials. Thank you for trusting RokaWright with your next piece.</p>`;
  document.body.append(q);
  document.querySelector("#quote-preview")?.remove();
  const preview = document.createElement("dialog");
  preview.id = "quote-preview";
  preview.innerHTML = `<h2>Your printable quote</h2><p>Save PDF downloads a real PDF directly, without a print dialog. For paper printing, open the downloaded PDF in your browser and print it.</p><div class="actions"><button type="button" id="quote-print">Print / Save as PDF</button><button type="button" class="quiet" id="quote-download">Download printable quote</button><button type="button" class="quiet" id="quote-close">Close</button></div><p id="pdf-status" role="status"></p><div class="quote-sheet">${q.innerHTML}</div>`;
  document.body.append(preview);
  preview.showModal();
  preview.querySelector("#quote-close").onclick = () => {
    preview.close();
    preview.remove();
  };
  preview.querySelector("#quote-print").textContent = "Save PDF";
  preview.querySelector("#quote-print").onclick = async () => {
    const button=preview.querySelector("#quote-print");button.disabled=true;button.textContent="Creating PDF…";
    try {
      await RokaPDF.downloadPDF(structuredClone(draft), document.querySelector('.header-logo svg').outerHTML);
      preview.querySelector('#pdf-status').textContent='PDF download requested. Check your browser’s Downloads. If this preview blocks downloads, use the printable quote option below.';
    } catch(e) { preview.querySelector('#pdf-status').textContent='Could not create the PDF: '+e.message; }
    finally {button.disabled=false;button.textContent='Save PDF';}
  };
  preview.querySelector("#quote-download").onclick = () => {
    const html = `<!doctype html><html lang="en"><meta charset="utf-8"><title>RokaWright quote</title><style>body{font:14px Arial;color:#272923;max-width:900px;margin:40px auto;padding:25px}h1{font:40px Georgia}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 6px;border-bottom:1px solid #ccc}.quote-total{text-align:right}.quote-note{margin-top:30px}button{padding:12px;background:#414b36;color:white;border:0}@media print{button,.instructions{display:none}@page{margin:18mm}}</style><button onclick="window.print()">Print / Save as PDF</button><p class="instructions">Choose “Save as PDF” in the print dialog.</p>${q.innerHTML}</html>`;
    const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    const a = document.createElement("a");
    a.href = url;
    a.download =
      "RokaWright-quote-" +
      draft.reference.replace(/[^a-zA-Z0-9_-]/g, "") +
      ".html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
}
document.querySelectorAll("nav button").forEach(
  (b) =>
    (b.onclick = async () => {
      view = b.dataset.view;
      render();
    }),
);
$("#backup-open").onclick = () => $("#backup").showModal();
$("#backup-close").onclick = () => $("#backup").close();
$("#export").onclick = () => {
  const raw = blocked
    ? localStorage.getItem(KEY)
    : JSON.stringify(data, null, 2);
  const url = URL.createObjectURL(
    new Blob([raw || ""], { type: "application/json" }),
  );
  const a = document.createElement("a");
  a.href = url;
  a.download = "RokaWright-backup-" + today() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
$("#import").onchange = async (e) => {
  pending = null;
  $("#restore").hidden = true;
  try {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 10000000)
      throw Error("Backup is too large (maximum 10 MB).");
    pending = validate(JSON.parse(await file.text()));
    $("#backup-message").textContent =
      `Validated: ${pending.customers.length} customers, ${pending.jobs.length} jobs, ${pending.services.length} services. Restoring replaces all saved data on this device. Download a backup first.`;
    $("#restore").hidden = false;
  } catch (e) {
    $("#backup-message").textContent = "Cannot restore: " + e.message;
  }
};
$("#restore").onclick = async () => {
  if (
    !pending ||
    !(await askConfirm(
      "Replace ALL saved customers, jobs, and prices with this backup? This cannot be undone without your current backup.",
    ))
  )
    return;
  try {
    localStorage.setItem(KEY, JSON.stringify(pending));
    data = pending;
    blocked = false;
    pending = null;
    draft = newJob();
    dirty = false;
    customerEdit = null;
    $("#restore").hidden = true;
    $("#backup").close();
    render();
    toast("Backup restored successfully.");
  } catch (e) {
    $("#backup-message").textContent = "Restore failed: " + e.message;
  }
};
render();
if (blocked)
  toast(
    "Existing saved data could not be read. It has NOT been overwritten. Use Backup & restore to recover it.",
  );

document.querySelector(".brand").onclick = e => {
  e.preventDefault();
  document.querySelectorAll('dialog[open]').forEach(d=>d.close());
  view="new"; render();
  window.scrollTo({top:0,behavior:'instant'});
};
</script>
